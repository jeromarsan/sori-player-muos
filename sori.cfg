# Dossiers de musique (un dossier par album). Plusieurs lignes possibles.
# music_dir=/mnt/mmc/MUSIC
# music_dir=/mnt/sdcard/MUSIC
# start_volume=0.6
# debug_input=1   (affiche le dernier bouton détecté)

# Thème et couleur se choisissent dans l'appli (Select > Réglages).
# Valeurs de départ seulement, ignorées dès qu'on a choisi dans Réglages :
# theme=sombre          (ou clair)
# langue=auto           (fr, en, es, pt, it, de — auto = langue de la console, sinon anglais)
# couleur=bleu          (corail, jaune, menthe, violet, rose, album, ou un code #RRGGBB)

# ecran_veille=60 (secondes sans bouton pendant la lecture avant d'éteindre l'écran ; 0 = jamais)
# inverser_ab=1   (si A et B sont à l'envers)
# inverser_xy=1   (si X et Y sont à l'envers)
